<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("mylink", {
        init: function() {  
         this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
           })
        }
      })
    </script>


  </head>
  <body>
  <a-scene cursor="rayOrigin: mouse">
    <a-assets>
      <img id="imgportal" src="assets/portal.jpg" >
      <img id="imgSortida" src="assets/entragroc.png" >
      <img id="imgFantasma" src="assets/blue.jpg" >
      <img id="imgCasa" src="assets/labo.jpg" >
      <a-asset-item id="scientist" src="assets/science/scene.gltf"></a-asset-item>
    </a-assets>
   
    <a-entity camera look-controls wasd-controls="false">
    <!-- fuseTimeout = el temps que triga en fer click des de que es posiciona sobre un objecte-->
     <a-entity cursor="fuse: true; fuseTimeout: 2000"
           position="0 0 -1"
           geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
           material="color: red; shader: flat"
           animation="property: components.material.material.color;
                 type: color;
                 to: white;
                 dur: 1000;
                 dir: alternate;
                 loop: true">
     </a-entity>
    </a-entity>
   
   
      <a-sky src="#imgCasa"></a-sky>
      <a-sphere position="5 2 -5" radius="1"  src="#imgFantasma"
                animation="property: rotation; dur: 10000;
                       to: 0 360 0; loop: true">          
       </a-sphere>
      <a-entity gltf-model="assets/science/scene.gltf" position="1.91553 -3.20196 -5" scale="0.08053 0.08053 0.08053" rotation="0 -29.030625563688552 0" 
                animation="property: position; dur: 2000; from: 0 -3.5 -5; to: 0 -3 -5; dir: alternate; loop: true" 
                mylink="href: ex6_2.html">         
      </a-entity>
      <a-plane position="-1.5 0 1" src="#imgportal" rotation="0 150 0"  transparent="true"></a-plane>
      <a-plane position="-1.5 0 0.9" src="#imgSortida" rotation="0 150 0"  width="0.5" height="0.5" transparent="true" mylink="href: https://asuarezzz.github.io/web3d/"></a-plane>    </a-scene>
  </body>
</html>
